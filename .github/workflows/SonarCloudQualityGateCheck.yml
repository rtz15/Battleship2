name: SonarCloud Quality Gate Check

on:
  workflow_dispatch:

jobs:
  sonarcloud-quality-gate:
    name: SonarCloud Quality Gate Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: SonarCloud is not configured for this repository
        run: |
          echo "This workflow is manual-only until SonarCloud project settings and secrets are configured."
          echo "Required setup includes a valid SonarCloud project and repository secrets such as SONAR_TOKEN."
