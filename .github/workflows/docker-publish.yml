name: Docker Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  configuration-check:
    if: ${{ vars.DOCKERHUB_USERNAME == '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Skip publish because Docker Hub username is missing
        run: echo "Skipping Docker publish. Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to enable this workflow."

  publish:
    if: ${{ vars.DOCKERHUB_USERNAME != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build shaded jar
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        run: mvn -B clean package --file pom.xml

      - name: Set up Docker Buildx
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Skip publish because Docker Hub token is missing
        if: ${{ env.DOCKERHUB_TOKEN == '' }}
        run: echo "Skipping Docker publish. Configure DOCKERHUB_TOKEN to enable this workflow."

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and publish Docker image
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/battleship-game:latest
            ${{ env.DOCKERHUB_USERNAME }}/battleship-game:${{ github.sha }}
